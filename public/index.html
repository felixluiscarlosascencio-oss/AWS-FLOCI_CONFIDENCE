<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis de imágenes con AWS Rekognition</title>
</head>
<body>
  <h1>Analizando archivos con AWS</h1>

  <form id="uploadForm">
    <div>
      <label for="imagen">Seleccione imagen</label>
      <input type="file" name="imagen" id="imagen" accept="image/*" required>
    </div>
    <button type="submit">Enviar</button>
  </form>

  <div>
    <h3>Resultados del análisis</h3>
    <ul id="listaEtiquetas"></ul>
  </div>

  <script>
    const form = document.getElementById('uploadForm')
    const listaEtiquetas = document.getElementById('listaEtiquetas')

    // Agrega un <li> con texto plano a la lista
    function agregarItem(texto) {
      const li = document.createElement('li')
      li.textContent = texto
      listaEtiquetas.appendChild(li)
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault() // Detenemos el envío normal del formulario

      // FormData = contenedor de datos del formulario
      const formData = new FormData(form)

      listaEtiquetas.innerHTML = ''
      agregarItem('Analizando imagen con AWS...')

      // Enviar los datos por el API
      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          body: formData
        })

        // El servicio AWS devuelve la resolución
        const data = await response.json()

        listaEtiquetas.innerHTML = ''

        if (data.success) {
          if (data.labels.length === 0) {
            agregarItem('No se detectaron etiquetas con la confianza mínima.')
            return
          }

          data.labels.forEach((label) => {
            agregarItem(`Etiqueta: ${label.Name} - confianza: ${label.Confidence.toFixed(2)}%`)
          })
        } else {
          // Cuidado: en producción no se deben exponer todos los errores.
          // El detalle técnico se registra en el servidor.
          agregarItem(data.error)
          if (data.details) agregarItem(data.details)
          if (data.code) agregarItem(data.code)
        }
      } catch (error) {
        console.error(error)
        listaEtiquetas.innerHTML = ''
        agregarItem('Error de conexión')
      }
    })
  </script>
</body>
</html>
