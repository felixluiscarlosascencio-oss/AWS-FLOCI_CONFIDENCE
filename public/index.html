<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extracción de texto con AWS Textract</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Análisis de Documentos PDF</h1>
      <p>Detección de texto con AWS Textract (DetectDocumentText)</p>
    </header>

    <section class="app-body">
      <form id="uploadForm">
        <label class="dropzone" id="dropzone" for="documento">
          <span class="titulo" id="nombreArchivo">Haga clic o arrastre un archivo PDF aquí</span>
          <span class="ayuda">Formato PDF (Máximo 5 MB)</span>
          <input type="file" name="documento" id="documento" accept="application/pdf" required>
        </label>

        <button type="submit" class="btn" id="btnEnviar">Extraer Texto</button>
      </form>

      <div class="resultados">
        <h2>Texto Extraído</h2>
        <div class="estado" id="estado" role="status" aria-live="polite"></div>
        <ul class="lista" id="listaTexto"></ul>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('uploadForm')
    const inputDoc = document.getElementById('documento')
    const dropzone = document.getElementById('dropzone')
    const nombreArchivo = document.getElementById('nombreArchivo')
    const btnEnviar = document.getElementById('btnEnviar')
    const estado = document.getElementById('estado')
    const listaTexto = document.getElementById('listaTexto')

    const TEXTO_INICIAL = 'Haga clic o arrastre un archivo PDF aquí'

    function mostrarEstado(texto, { cargando = false, error = false } = {}) {
      estado.className = error ? 'estado error' : 'estado'
      estado.textContent = ''
      if (cargando) {
        const spinner = document.createElement('span')
        spinner.className = 'spinner'
        estado.appendChild(spinner)
      }
      const span = document.createElement('span')
      span.textContent = texto
      estado.appendChild(span)
    }

    function agregarLineaTexto(texto) {
      const li = document.createElement('li')
      li.className = 'etiqueta'
      li.textContent = texto
      listaTexto.appendChild(li)
    }

    function actualizarArchivo(archivo) {
      if (!archivo) {
        nombreArchivo.textContent = TEXTO_INICIAL
        return
      }

      // Si el archivo supera 5 MB, vaciamos la lista para que NO aparezca el texto extraído previo (floci 99.9%)
      if (archivo.size > 5 * 1024 * 1024) {
        listaTexto.innerHTML = ''
        mostrarEstado('El archivo supera los 5 MB permitidos.', { error: true })
        inputDoc.value = ''
        nombreArchivo.textContent = TEXTO_INICIAL
        return
      }

      // Si el archivo es válido, se vacía la lista previa y los mensajes de error
      listaTexto.innerHTML = ''
      mostrarEstado('')
      nombreArchivo.textContent = archivo.name
    }

    inputDoc.addEventListener('change', () => {
      actualizarArchivo(inputDoc.files[0])
    })

    ;['dragenter', 'dragover'].forEach((evento) => {
      dropzone.addEventListener(evento, (e) => {
        e.preventDefault()
        dropzone.classList.add('arrastrando')
      })
    })
    ;['dragleave', 'drop'].forEach((evento) => {
      dropzone.addEventListener(evento, (e) => {
        e.preventDefault()
        dropzone.classList.remove('arrastrando')
      })
    })
    dropzone.addEventListener('drop', (e) => {
      const archivo = e.dataTransfer.files[0]
      if (archivo && archivo.type === 'application/pdf') {
        inputDoc.files = e.dataTransfer.files
        actualizarArchivo(archivo)
      } else {
        listaTexto.innerHTML = ''
        mostrarEstado('Solo se admiten archivos PDF.', { error: true })
      }
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const formData = new FormData(form)

      // Vaciar siempre la lista al iniciar un nuevo envío
      listaTexto.innerHTML = ''
      btnEnviar.disabled = true
      mostrarEstado('Procesando PDF con AWS Textract...', { cargando: true })

      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          body: formData
        })

        const data = await response.json()

        if (data.success) {
          if (data.texto.length === 0) {
            mostrarEstado('No se detectó texto en el PDF.')
            return
          }
          // Limpia el mensaje de "Procesando..." y deja únicamente las líneas extraídas
          mostrarEstado('')
          data.texto.forEach(agregarLineaTexto)
        } else {
          // Si hay error desde el backend, asegura vaciar la lista
          listaTexto.innerHTML = ''
          mostrarEstado(data.error || 'No se pudo analizar el PDF', { error: true })
        }
      } catch (error) {
        console.error(error)
        listaTexto.innerHTML = ''
        mostrarEstado('Error de conexión con el servidor', { error: true })
      } finally {
        btnEnviar.disabled = false
      }
    })
  </script>
</body>
</html>
